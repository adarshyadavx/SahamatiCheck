[project]
name = "sahamati-api"
version = "0.1.0"
description = "SahamatiCheck public API v1 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "sahamati-core",
  "sahamati-worker",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahamati_api"]
