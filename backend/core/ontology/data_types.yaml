# Data-type ontology (source of truth). Edges are child -> parent.
# Two hierarchies: personal_info (data about a person) and app_activity
# (data about app use and performance). Removing or re-parenting a node is a
# MAJOR version bump.
#
# Fields: id, parents, label_en, label_hi, aliases (lower-case phrases matched
# in policy text, longest match wins), dpdp_sensitive, report_category (optional: which of the
# ten report-card categories the node belongs to; a node without one inherits from its nearest
# ancestor that has one; PLAN.md §4.9).
version: "2026.10.1"
kind: data_type
roots: [personal_info, app_activity]
report_categories: [location, contacts, photos_files, camera_mic, messages_calls, money_payments, identity, health, ads_tracking, account_profile]
nodes:
  # ---------------------------------------------------------------- personal_info
  - id: personal_info
    parents: []
    label_en: Personal information
    label_hi: व्यक्तिगत जानकारी
    aliases: [personal information, personal data, personal details, personally identifiable information, your information, your data, user data, information about you, data about you]
    dpdp_sensitive: false

  - id: identifiers
    parents: [personal_info]
    label_en: Identifiers
    label_hi: पहचानकर्ता
    aliases: [identifiers, unique identifiers]
    dpdp_sensitive: false
  - id: device_id
    parents: [identifiers]
    label_en: Device or other IDs
    label_hi: डिवाइस या अन्य आईडी
    aliases: [device id, device ids, device identifier, device identifiers, device or other ids, device information]
    dpdp_sensitive: false
    report_category: ads_tracking
