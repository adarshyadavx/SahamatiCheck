    parents: [device_id]
    label_en: IMEI number
    label_hi: आईएमईआई नंबर
    aliases: [imei, imei number, hardware identifier, hardware identifiers]
    dpdp_sensitive: false
  - id: user_id
    parents: [identifiers]
    label_en: User IDs
    label_hi: उपयोगकर्ता आईडी
