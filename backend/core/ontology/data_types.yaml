  - id: government_id
    parents: [identifiers]
    label_en: Government ID
    label_hi: सरकारी पहचान पत्र
    aliases: [government id, government identifier, aadhaar, aadhaar number, pan, pan number, pan card, passport number, voter id, driving licence number]
