# SDK package prefixes -> actor + data types.
# action: "collect" means data the SDK gathers inside the app (Play counts this
# as collection by the app); "share" means the SDK's purpose is to transfer the
# data to the named third-party actor. Longest matching prefix wins.
# doc: the vendor's own data-disclosure / documentation page. Every entry must
# be re-checked against its doc before it is used for the corpus run
# (reviewed: false until then). Evidence confidence for SDKs is 0.85.
version: "2026.10.1"
sdks:
  # --- crash reporting / diagnostics (service providers)
  - {prefix: com.google.firebase.crashlytics, name: Firebase Crashlytics, actor: service_provider, action: collect, data_types: [crash_logs, device_id], doc: "https://firebase.google.com/docs/android/play-data-disclosure", reviewed: false}
  - {prefix: io.sentry, name: Sentry, actor: service_provider, action: collect, data_types: [crash_logs], doc: "https://docs.sentry.io/platforms/android/data-management/", reviewed: false}
  - {prefix: com.bugsnag.android, name: Bugsnag, actor: service_provider, action: collect, data_types: [crash_logs], doc: "https://docs.bugsnag.com/platforms/android/", reviewed: false}
  - {prefix: com.instabug, name: Instabug, actor: service_provider, action: collect, data_types: [crash_logs, app_interactions], doc: "https://docs.instabug.com/", reviewed: false}
  - {prefix: com.microsoft.appcenter.crashes, name: App Center Crashes, actor: service_provider, action: collect, data_types: [crash_logs], doc: "https://learn.microsoft.com/appcenter/sdk/", reviewed: false}
  - {prefix: com.newrelic.agent.android, name: New Relic Mobile, actor: service_provider, action: collect, data_types: [performance_data, crash_logs], doc: "https://docs.newrelic.com/docs/mobile-monitoring/", reviewed: false}
  - {prefix: com.datadog.android, name: Datadog RUM, actor: service_provider, action: collect, data_types: [performance_data, app_interactions], doc: "https://docs.datadoghq.com/real_user_monitoring/android/", reviewed: false}
  - {prefix: com.google.firebase.perf, name: Firebase Performance Monitoring, actor: service_provider, action: collect, data_types: [performance_data], doc: "https://firebase.google.com/docs/android/play-data-disclosure", reviewed: false}

