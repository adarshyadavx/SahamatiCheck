# docker compose -f infra/docker-compose.yml up --build
# API on http://localhost:8000 (Postgres + Redis + Celery worker).
name: sahamaticheck

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sahamati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahamati-dev-only}
      POSTGRES_DB: sahamati
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahamati -d sahamati"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://sahamati:${POSTGRES_PASSWORD:-sahamati-dev-only}@postgres:5432/sahamati
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "0"
      SAHAMATI_CORS_ORIGINS: http://localhost:3000
      SAHAMATI_TRUST_PROXY: "0"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANDROZOO_API_KEY: ${ANDROZOO_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
